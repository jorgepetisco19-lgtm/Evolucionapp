# Mantiene despierto el proyecto gratuito de Supabase (que se pausa tras ~1 semana con poca actividad).
# Cada 3 días llama a la función ping() de la base de datos (supabase/11-ping.sql) con la clave pública (anon) de js/config.js.
# ping() solo devuelve el número 1: no lee ni toca datos de nadie. Pero es una consulta real y cuenta como «actividad».
# Si Supabase no responde bien (p. ej. el proyecto ya está pausado), la ejecución sale en ROJO y GitHub te avisa por correo.
# Probarlo a mano: pestaña «Actions» → «Mantener Supabase despierto» → «Run workflow».
name: Mantener Supabase despierto

on:
  schedule:
    - cron: '23 5 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Consultar la base de datos
        run: |
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" js/config.js | head -n1)
          KEY=$(grep -oE "eyJ[A-Za-z0-9._-]+" js/config.js | head -n1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::No encuentro la URL o la clave de Supabase en js/config.js"
            exit 1
          fi
          echo "Consultando $URL"
          CODE=$(curl -sS -m 30 --retry 3 --retry-delay 10 -X POST -o /tmp/resp.json -w "%{http_code}" \
            "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "Respuesta HTTP $CODE"
          head -c 300 /tmp/resp.json; echo
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase respondió $CODE. Si el proyecto está pausado, pulsa «Resume project» en supabase.com. Si el mensaje dice que no existe la función ping, ejecuta supabase/11-ping.sql en el SQL Editor."
            exit 1
          fi
